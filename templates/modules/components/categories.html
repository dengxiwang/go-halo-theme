<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <ul
    th:fragment="categories"
    id="filters"
    th:if="${theme.config.firstPage.categoriesShowNumber != '0'}"
    th:with="
      categories=${categoryFinder.listAsTree()},
      totalCats=${#lists.size(categories)},
      catLimit=${(theme.config.firstPage.categoriesShowNumber != null) ? T(java.lang.Integer).valueOf(theme.config.firstPage.categoriesShowNumber) : 0}
    "
    class="flex flex-wrap gap-5 gap-y-3 rounded-lg border bg-white p-4 py-3 text-sm font-medium max-sm:p-3"
  >
    <!-- 全部分类（完全保留，不动） -->
    <li>
      <a
        href="/"
        class="group flex cursor-pointer items-center gap-1 transition-all hover:text-blue-500"
        th:classappend="${category == null} ? 'active-menu'"
      >
        <span class="max-w-32 overflow-hidden text-ellipsis">全部</span>
      </a>
    </li>

    <!-- 一级分类循环（🔥 核心2：加索引限制显示数量） -->
    <th:block>
      <li
        th:each="categoryItem, stat : ${categories}"
        th:if="${catLimit <= 0 or stat.index < catLimit}"
        class="relative flex items-center"
        x-data="{ open: false, canHover: window.matchMedia('(hover: hover) and (pointer: fine)').matches, pointerType: '', touchInput: false }"
        x-id="['category-submenu']"
        @mouseenter="if (canHover) open = true"
        @mouseleave="if (canHover) open = false"
        @click.outside="open = false"
        @keydown.escape.window="open = false"
      >
        <!-- 分类名称只负责跳转，带子分类时由旁边的独立按钮负责展开。 -->
        <a
          th:href="@{${categoryItem.status.permalink}}"
          th:title="|${categoryItem.spec.displayName} (${categoryItem.postCount ?: 0})|"
          class="group flex cursor-pointer items-center gap-1 transition-all hover:text-blue-500"
          th:attr="data-has-children=${not #lists.isEmpty(categoryItem.children)}"
          th:classappend="${categoryItem.metadata.name == category.metadata.name} ? 'active-menu'"
        >
          <span
            class="max-w-48 overflow-hidden text-ellipsis text-nowrap"
            th:text="|${categoryItem.spec.displayName} (${categoryItem.postCount ?: 0})|"
            >分类名</span
          >
        </a>

        <button
          th:if="${not #lists.isEmpty(categoryItem.children)}"
          type="button"
          class="category-submenu-toggle ml-0.5 inline-flex h-8 w-8 shrink-0 touch-manipulation items-center justify-center rounded-md transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 sm:h-6 sm:w-6"
          th:attr="aria-label=|展开或收起 ${categoryItem.spec.displayName} 的子分类|"
          aria-haspopup="true"
          :aria-controls="$id('category-submenu')"
          :aria-expanded="open"
          :class="{ 'is-open': open, 'is-touch-input': touchInput }"
          @pointerenter="if ($event.pointerType === 'mouse') touchInput = false"
          @pointerdown="pointerType = $event.pointerType; touchInput = pointerType !== 'mouse'"
          @pointercancel="pointerType = ''"
          @click="open = canHover && pointerType === 'mouse' && $event.detail > 0 ? true : !open; pointerType = ''"
        >
          <svg
            aria-hidden="true"
            class="h-[14px] w-[14px] transition-transform duration-200"
            :class="{ 'rotate-180': open }"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <!-- 子分类下拉菜单 -->
        <ul
          th:if="${not #lists.isEmpty(categoryItem.children)}"
          :id="$id('category-submenu')"
          x-show="open"
          x-cloak
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100"
          x-transition:leave="transition ease-in duration-100"
          x-transition:leave-start="opacity-100 scale-100"
          x-transition:leave-end="opacity-0 scale-95"
          class="category-submenu absolute left-1/2 top-full z-10 mt-1 w-max min-w-28 max-w-full -translate-x-1/2 rounded-lg border border-gray-300 bg-white px-1 py-1 shadow-sm"
        >
          <li
            th:each="childCategory : ${categoryItem.children}"
            class="cursor-pointer whitespace-nowrap rounded transition hover:bg-gray-100"
          >
            <a
              th:href="@{${childCategory.status.permalink}}"
              th:title="|${childCategory.spec.displayName} (${childCategory.postCount ?: 0})|"
              th:text="|${childCategory.spec.displayName} (${childCategory.postCount ?: 0})|"
              class="block overflow-hidden text-ellipsis px-2 py-1 transition-all hover:text-blue-500"
              th:classappend="${category != null and category.metadata.name == childCategory.metadata.name} ? 'active-menu'"
            >
            </a>
          </li>
        </ul>
      </li>
    </th:block>

    <!-- 🔥 核心3：更多按钮 → 跳转到分类总页，超限才显示 -->
    <li th:if="${catLimit > 0 && totalCats > catLimit}" class="relative">
      <a href="/categories" class="group flex cursor-pointer items-center gap-1 transition-all hover:text-blue-500">
        <span class="max-w-32 overflow-hidden text-ellipsis">更多 +</span>
      </a>
    </li>
  </ul>
</html>
